<header class="topo topo-publico">
  <div class="topo-dentro">
    <a class="marca" href="{{ url_for('agendar') }}">
      <span class="marca-icone" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 12c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 12a4 4 0 0 1 8 0M12 12v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      {{ NOME_CLINICA }}
    </a>
    {% if WHATSAPP_CLINICA and link_whatsapp(WHATSAPP_CLINICA) %}
    <a class="topo-contato" href="{{ link_whatsapp(WHATSAPP_CLINICA) }}" target="_blank" rel="noopener">Falar com a clínica</a>
    {% endif %}
  </div>
</header>
